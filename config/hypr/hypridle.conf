# ======================================================================
# hypridle — idle management
# ======================================================================
#
# Hyprlang, like hyprlock.
#
# CRITICAL: every hyprctl dispatch below uses the LUA EXPRESSION form.
# The old-style `hyprctl dispatch dpms off` is rejected by the Lua
# dispatcher and fails SILENTLY — the screen simply never turns off, with
# nothing in any log to say why.
# ======================================================================

general {
    # loginctl lock-session does nothing at all unless lock_cmd is defined
    # here. The pidof guard prevents stacking multiple hyprlock instances,
    # which is what produces the "I typed my password and it asked again"
    # bug.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before suspending, so waking never flashes the desktop.
    before_sleep_cmd = loginctl lock-session

    # Wake the displays after resume. Lua form — see the note above.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    ignore_dbus_inhibit = false      # honour idle inhibitors from apps
}

# 2.5 min — dim the backlight as a warning.
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%   # -s SAVES the current level first
    on-resume  = brightnessctl -r           # -r RESTORES the saved level
}

# 5 min — dim the keyboard backlight if there is one. Harmless if absent.
listener {
    timeout    = 300
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume  = brightnessctl -rd rgb:kbd_backlight
}

# 10 min — lock.
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 12 min — displays off.
listener {
    timeout    = 720
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min — suspend. Delete this listener if you never want auto-suspend.
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
