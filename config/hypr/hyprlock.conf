# ======================================================================
# hyprlock — lock screen
# ======================================================================
#
# hyprlock still uses HYPRLANG, not Lua. Only the compositor was migrated;
# the satellite hypr* tools kept their original config format.
#
# The palette below is generated by Matugen from the current wallpaper, so
# the lock screen matches the desktop it locked.
# ======================================================================

# Must come before any use of $primary and friends.
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    ignore_empty_input = true    # Enter on an empty field does nothing
    grace              = 0       # no unlock-without-password window
}

background {
    monitor = 
    # `screenshot` blurs whatever was on screen at lock time, which means
    # the lock screen always matches the current wallpaper without this
    # file needing to know its path.
    path        = screenshot
    blur_passes = 3
    blur_size   = 8
    brightness  = 0.6
    noise       = 0.0117
}

# Big clock.
label {
    monitor     = 
    text        = cmd[update:1000] date +"%H:%M"
    font_size   = 90
    font_family = $font
    color       = $on_surface
    position    = 0, 120
    halign      = center
    valign      = center
}

# Date.
label {
    monitor     = 
    text        = cmd[update:60000] date +"%A %d %B"
    font_size   = 18
    font_family = $font
    color       = $on_surface
    position    = 0, 40
    halign      = center
    valign      = center
}

# Keyboard layout indicator — worth having on an AZERTY machine, where
# typing a password on the wrong layout is the usual cause of a failed
# unlock.
label {
    monitor     = 
    text        = $LAYOUT
    font_size   = 12
    font_family = $font
    color       = $outline
    position    = 0, -130
    halign      = center
    valign      = center
}

input-field {
    monitor           = 
    size              = 320, 50
    outline_thickness = 2
    dots_size         = 0.25
    dots_spacing      = 0.3
    outer_color       = $primary
    inner_color       = $surface
    font_color        = $on_surface
    check_color       = $primary
    fail_color        = $error
    fade_on_empty     = false
    placeholder_text  = <i>Password</i>
    fail_text         = <i>$FAIL ($ATTEMPTS)</i>
    rounding          = 12
    position          = 0, -60
    halign            = center
    valign            = center
}
