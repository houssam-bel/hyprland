# ======================================================================
# Kitty
# ======================================================================

font_family      JetBrainsMono Nerd Font
font_size        11
disable_ligatures never

background_opacity      0.92
confirm_os_window_close 0
window_padding_width    8
scrollback_lines        10000

enable_audio_bell no
cursor_shape      beam
shell_integration enabled

# Kitty's own tab bar, styled to match the rest of the desktop.
tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style slanted

# Matugen owns colors.conf. This include is LAST on purpose: kitty applies
# directives in order, so a palette included here wins over anything set
# above it — and nothing needs to change in this file when the wallpaper does.
include colors.conf
