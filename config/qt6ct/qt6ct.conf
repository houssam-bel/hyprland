; Qt theming, so Dolphin and other KDE apps do not sit on a stock palette
; while everything else follows the wallpaper.
;
; environment.lua sets QT_QPA_PLATFORMTHEME=qt6ct, which is what routes Qt
; through this file. Matugen does not template it: Qt reads a binary colour
; SCHEME rather than CSS, so this pins Qt to a neutral dark theme that sits
; acceptably next to any generated palette.
;
; For a Qt palette that DOES follow the wallpaper, install hyprqt6engine
; (AUR) and set style=hyprqt6engine below.
;
; Fonts are deliberately left unset. qt6ct stores them as serialised QFont
; blobs, which are unreadable, easy to corrupt by hand, and fall back to a
; sane system default when absent. Set them through the qt6ct GUI instead.

[Appearance]
style=Breeze
icon_theme=Papirus-Dark
standard_dialogs=default

[Interface]
cursor_flash_time=1000
menus_have_icons=true
